name: Extraction et MAJ quotidienne de L'agenda sport

on:
  schedule:
    # 2:00 UTC = 3:00 du matin en heure française
    - cron: '0 2 * * *'
  workflow_dispatch: # Permet de lancer l'extraction manuellement à tout moment

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v3

      - name: Configuration de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Exécution du script de récupération des vraies data
        run: python update_sports.py

      - name: Sauvegarde automatique sur le dépôt
        run: |
          git config --global user.name 'AgendaSportBot'
          git config --global user.email 'bot@agendasport.local'
          git add data.json
          git commit -m "Mise a jour automatique des plannings sportifs réels" || exit 0
          git push
