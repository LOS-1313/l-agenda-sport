<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Agenda Sport</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome pour les icônes de repli -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0b0f19',
                            800: '#111827',
                            700: '#1f2937',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-900 text-gray-100 min-h-screen font-sans antialiased selection:bg-blue-600 selection:text-white">

    <!-- En-tête -->
    <header class="border-b border-gray-800 bg-dark-800/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/30 text-white">
                    <i class="fa-solid fa-trophy text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wider text-white">L'AGENDA SPORT</h1>
                    <p class="text-xs text-gray-400">Plannings officiels et diffusions en direct</p>
                </div>
            </div>

            <!-- Filtres par catégorie -->
            <div id="category-filters" class="flex flex-wrap justify-center gap-2">
                <button onclick="filterCategory('tous')" class="filter-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-blue-600 text-white shadow-md shadow-blue-600/20" data-category="tous">Tous</button>
                <button onclick="filterCategory('football')" class="filter-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-dark-700 text-gray-400 hover:text-white" data-category="football">Football</button>
                <button onclick="filterCategory('f1')" class="filter-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-dark-700 text-gray-400 hover:text-white" data-category="f1">F1</button>
                <button onclick="filterCategory('nfl')" class="filter-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-dark-700 text-gray-400 hover:text-white" data-category="nfl">NFL</button>
                <button onclick="filterCategory('spartiates')" class="filter-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-dark-700 text-gray-400 hover:text-white" data-category="spartiates">Spartiates</button>
                <button onclick="filterCategory('nba')" class="filter-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-dark-700 text-gray-400 hover:text-white" data-category="nba">NBA</button>
            </div>
        </div>
    </header>

    <!-- Contenu Principal -->
    <main class="max-w-5xl mx-auto px-4 py-8">
        <div id="agenda-container" class="space-y-8">
            <!-- Les événements seront injectés ici dynamiquement -->
        </div>
    </main>

    <!-- Script de chargement et rendu -->
    <script>
        let allEvents = [];
        let currentCategory = 'tous';

        async function loadData() {
            try {
                const response = await fetch('data.json');
                allEvents = await response.json();
                renderAgenda();
            } catch (error) {
                console.error("Erreur lors du chargement des données :", error);
                document.getElementById('agenda-container').innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <p>Impossible de charger le planning pour le moment.</p>
                    </div>
                `;
            }
        }

        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.category === category) {
                    btn.className = "filter-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-blue-600 text-white shadow-md shadow-blue-600/20";
                } else {
                    btn.className = "filter-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-dark-700 text-gray-400 hover:text-white";
                }
            });
            renderAgenda();
        }

        function formatDateTitle(dateStr) {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const date = new Date(dateStr);
            return date.toLocaleDateString('fr-FR', options).toUpperCase();
        }

        function renderAgenda() {
            const container = document.getElementById('agenda-container');
            const filtered = currentCategory === 'tous' 
                ? allEvents 
                : allEvents.filter(e => e.category === currentCategory);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 bg-dark-800/40 rounded-2xl border border-gray-800/60">
                        <p class="text-gray-400 font-medium">Aucun événement trouvé pour cette catégorie.</p>
                    </div>
                `;
                return;
            }

            const grouped = {};
            filtered.forEach(event => {
                if (!grouped[event.date]) {
                    grouped[event.date] = [];
                }
                grouped[event.date].push(event);
            });

            let html = '';
            for (const [date, events] of Object.entries(grouped)) {
                html += `
                    <div class="space-y-3">
                        <div class="flex items-center space-x-2 text-blue-400 font-bold text-sm tracking-wide pt-2">
                            <i class="fa-regular fa-calendar-days"></i>
                            <h2>${formatDateTitle(date)}</h2>
                        </div>
                        <div class="space-y-2">
                `;

                events.forEach(match => {
                    const channelsHtml = match.channels && match.channels.length > 0 
                        ? match.channels.map(ch => `<span class="px-2.5 py-1 rounded text-[11px] font-black uppercase tracking-wider bg-purple-900/80 text-purple-200 border border-purple-700/50">${ch}</span>`).join('')
                        : '';

                    html += `
                        <div class="bg-dark-800/80 hover:bg-dark-800 border border-gray-800/80 rounded-xl p-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 transition-all shadow-sm">
                            
                            <!-- Gauche : Logo Ligue, Bloc Heure/Nature, et Équipes -->
                            <div class="flex items-center space-x-4 flex-grow">
                                <!-- 1. Logo Sport / Ligue -->
                                <div class="w-10 h-10 rounded-lg bg-dark-900/90 border border-gray-800 flex items-center justify-center shrink-0 overflow-hidden p-1.5">
                                    ${match.isImgIcon ? `<img src="${match.sportIcon}" alt="" class="w-full h-full object-contain">` : `<i class="fa-solid ${match.sportIcon} text-lg text-blue-400"></i>`}
                                </div>

                                <!-- 2. Bloc Heure et Nature -->
                                <div class="flex flex-col items-center justify-center shrink-0 bg-dark-900/60 px-3 py-1.5 rounded-lg border border-gray-800/50 w-32">
                                    ${match.nature ? `<span class="text-[10px] font-bold text-blue-400 uppercase tracking-wider mb-0.5 text-center">${match.nature}</span>` : ''}
                                    <span class="text-base font-extrabold text-white tracking-tight text-center">${match.time}</span>
                                </div>

                                <!-- 3. Équipes / Événement -->
                                <div class="space-y-1.5 flex-grow pl-2">
                                    <!-- Ligne 1 : Équipe 1 / Grand Prix (Gras, et extra en normal) -->
                                    <div class="flex items-center space-x-2.5">
                                        <img src="${match.team1Logo}" alt="" class="w-6 h-6 object-contain">
                                        <div class="flex items-center space-x-1.5">
                                            <span class="text-gray-100 font-bold text-sm tracking-tight">${match.team1}</span>
                                            ${match.team1Extra ? `<span class="text-gray-300 font-normal text-sm">${match.team1Extra}</span>` : ''}
                                        </div>
                                        ${match.showHomeTeam1 ? '<span class="text-[10px] bg-gray-900 text-gray-400 px-1.5 py-0.5 rounded border border-gray-800">Dom</span>' : ''}
                                    </div>

                                    <!-- Ligne 2 : Équipe 2 / Circuit F1 (Sans image si vide, police italique uniforme) -->
                                    <div class="flex items-center space-x-2.5">
                                        ${match.team2Logo ? `<img src="${match.team2Logo}" alt="" class="w-6 h-6 object-contain">` : ''}
                                        <span class="text-gray-300 text-xs italic font-normal">${match.team2}</span>
                                        ${match.showHomeTeam2 ? '<span class="text-[10px] bg-gray-900 text-gray-400 px-1.5 py-0.5 rounded border border-gray-800">Dom</span>' : ''}
                                    </div>

                                    <!-- Ligne 3 : Stade en italique (uniquement NFL si renseigné) -->
                                    ${match.venue ? `<div class="text-xs text-gray-400 italic pl-8.5">${match.venue}</div>` : ''}
                                </div>
                            </div>

                            <!-- Droite : Chaînes TV -->
                            <div class="flex items-center gap-1.5 flex-wrap justify-end w-full md:w-auto pt-2 md:pt-0 border-t md:border-t-0 border-gray-800/50">
                                ${channelsHtml}
                            </div>

                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        loadData();
    </script>
</body>
</html>
