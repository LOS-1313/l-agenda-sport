<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Agenda Sport</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome pour les icônes de repli -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0b0f19',
                            800: '#111827',
                            700: '#1f2937',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-900 text-gray-100 min-h-screen font-sans antialiased selection:bg-blue-600 selection:text-white">

    <!-- En-tête -->
    <header class="border-b border-gray-800 bg-dark-800/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/30 text-white">
                    <i class="fa-solid fa-trophy text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wider text-white">L'AGENDA SPORT</h1>
                    <p class="text-xs text-gray-400">Plannings officiels et diffusions en direct</p>
                </div>
            </div>

            <!-- Filtres par catégorie -->
            <div id="category-filters" class="flex flex-wrap justify-center gap-2">
                <button onclick="filterCategory('tous')" class="filter-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-blue-600 text-white shadow-md shadow-blue-600/20" data-category="tous">Tous</button>
                <button onclick="filterCategory('football')" class="filter-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-dark-700 text-gray-400 hover:text-white" data-category="football">Football</button>
                <button onclick="filterCategory('f1')" class="filter-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-dark-700 text-gray-400 hover:text-white" data-category="f1">F1</button>
                <button onclick="filterCategory('nfl')" class="filter-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-dark-700 text-gray-400 hover:text-white" data-category="nfl">NFL</button>
                <button onclick="filterCategory('nba')" class="filter-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-dark-700 text-gray-400 hover:text-white" data-category="nba">NBA</button>
                <button onclick="filterCategory('spartiates')" class="filter-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-dark-700 text-gray-400 hover:text-white" data-category="spartiates">Spartiates</button>
            </div>
        </div>
    </header>

    <!-- Contenu Principal -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <!-- Colonne de Gauche : Menu Calendrier Multiple & Bouton Maintenant -->
            <aside class="space-y-4 lg:sticky lg:top-24 h-fit">
                <div class="bg-dark-800/80 border border-gray-800/80 rounded-xl p-4 space-y-3 shadow-sm">
                    <h3 class="text-xs font-black text-gray-400 uppercase tracking-wider px-2"><i class="fa-solid fa-calendar-days mr-2"></i>Calendrier</h3>
                    <div class="flex flex-col space-y-1">
                        <button onclick="toggleDateRange('avenir')" class="date-filter-btn w-full text-left px-3 py-2 rounded-lg text-xs font-bold transition-all bg-blue-600 text-white shadow-md shadow-blue-600/20" data-range="avenir">À venir</button>
                        <button onclick="toggleDateRange('aujourdhui')" class="date-filter-btn w-full text-left px-3 py-2 rounded-lg text-xs font-bold transition-all bg-blue-600 text-white shadow-md shadow-blue-600/20" data-range="aujourdhui">Aujourd'hui</button>
                        <button onclick="toggleDateRange('hier')" class="date-filter-btn w-full text-left px-3 py-2 rounded-lg text-xs font-bold transition-all text-gray-400 hover:bg-dark-700 hover:text-white" data-range="hier">Hier</button>
                        <button onclick="toggleDateRange('semaine')" class="date-filter-btn w-full text-left px-3 py-2 rounded-lg text-xs font-bold transition-all text-gray-400 hover:bg-dark-700 hover:text-white" data-range="semaine">Semaine dernière</button>
                        <button onclick="toggleDateRange('toute')" class="date-filter-btn w-full text-left px-3 py-2 rounded-lg text-xs font-bold transition-all text-gray-400 hover:bg-dark-700 hover:text-white" data-range="toute">Toute la saison</button>
                    </div>
                </div>

                <!-- Bouton Maintenant -->
                <button onclick="scrollToNow()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold uppercase tracking-wider py-3 px-4 rounded-xl shadow-lg shadow-emerald-600/20 transition-all flex items-center justify-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-white animate-pulse"></span>
                    Maintenant
                </button>
            </aside>

            <!-- Colonne de Droite : Liste des Affiches -->
            <section class="lg:col-span-3">
                <div id="agenda-container" class="space-y-8">
                    <!-- Injection dynamique -->
                </div>
            </section>

        </div>
    </main>

    <!-- Script de chargement, rendu et filtrage multiple -->
    <script>
        let allEvents = [];
        let currentCategory = 'tous';
        let activeDateRanges = new Set(['avenir', 'aujourdhui']);

        async function loadData() {
            try {
                const response = await fetch('data.json');
                allEvents = await response.json();
                renderAgenda();
            } catch (error) {
                console.error("Erreur lors du chargement des données :", error);
                document.getElementById('agenda-container').innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <p>Impossible de charger le planning pour le moment.</p>
                    </div>
                `;
            }
        }

        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('#category-filters button').forEach(btn => {
                if (btn.dataset.category === category) {
                    btn.className = "filter-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-blue-600 text-white shadow-md shadow-blue-600/20";
                } else {
                    btn.className = "filter-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-dark-700 text-gray-400 hover:text-white";
                }
            });
            renderAgenda();
        }

        function toggleDateRange(range) {
            if (activeDateRanges.has(range)) {
                activeDateRanges.delete(range);
            } else {
                activeDateRanges.add(range);
            }

            document.querySelectorAll('.date-filter-btn').forEach(btn => {
                const r = btn.dataset.range;
                if (activeDateRanges.has(r)) {
                    btn.className = "date-filter-btn w-full text-left px-3 py-2 rounded-lg text-xs font-bold transition-all bg-blue-600 text-white shadow-md shadow-blue-600/20";
                } else {
                    btn.className = "date-filter-btn w-full text-left px-3 py-2 rounded-lg text-xs font-bold transition-all text-gray-400 hover:bg-dark-700 hover:text-white";
                }
            });
            renderAgenda();
        }

        function formatDateTitle(dateStr) {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const date = new Date(dateStr);
            return date.toLocaleDateString('fr-FR', options).toUpperCase();
        }

        function getNormalizedDate(dateStr) {
            const d = new Date(dateStr);
            d.setHours(0, 0, 0, 0);
            return d;
        }

        function renderAgenda() {
            const container = document.getElementById('agenda-container');
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const filtered = allEvents.filter(e => {
                if (currentCategory !== 'tous' && e.category !== currentCategory) return false;
                if (activeDateRanges.size === 0) return false;

                const evDate = getNormalizedDate(e.date);
                const diffDays = Math.round((evDate - today) / (1000 * 60 * 60 * 24));

                let matchAnyRange = false;

                if (activeDateRanges.has('toute')) return true;

                if (activeDateRanges.has('avenir') && (diffDays > 0 || (diffDays === 0 && (e.isLive || !e.isFinished)))) {
                    matchAnyRange = true;
                }
                if (activeDateRanges.has('aujourdhui') && diffDays === 0) {
                    matchAnyRange = true;
                }
                if (activeDateRanges.has('hier') && diffDays === -1) {
                    matchAnyRange = true;
                }
                if (activeDateRanges.has('semaine') && diffDays >= -7 && diffDays < 0) {
                    matchAnyRange = true;
                }

                return matchAnyRange;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 bg-dark-800/40 rounded-2xl border border-gray-800/60">
                        <p class="text-gray-400 font-medium">Aucun événement trouvé pour cette sélection.</p>
                    </div>
                `;
                return;
            }

            const grouped = {};
            filtered.forEach(event => {
                if (!grouped[event.date]) {
                    grouped[event.date] = [];
                }
                grouped[event.date].push(event);
            });

            let html = '';
            for (const [date, events] of Object.entries(grouped)) {
                html += `
                    <div class="space-y-3">
                        <div class="flex items-center space-x-2 text-blue-400 font-bold text-sm tracking-wide pt-2">
                            <i class="fa-regular fa-calendar-days"></i>
                            <h2>${formatDateTitle(date)}</h2>
                        </div>
                        <div class="space-y-2">
                `;

                events.forEach(match => {
                    const channelsHtml = match.channels && match.channels.length > 0 
                        ? match.channels.map(ch => `<span class="px-2.5 py-1 rounded text-[11px] font-black uppercase tracking-wider bg-purple-900/80 text-purple-200 border border-purple-700/50">${ch}</span>`).join('')
                        : '';

                    const logo1Html = match.team1Logo && match.team1 !== 'TBD' ? `<img src="${match.team1Logo}" alt="" class="w-6 h-6 object-contain">` : '';
                    const logo2Html = match.team2Logo && match.team2 !== 'TBD' ? `<img src="${match.team2Logo}" alt="" class="w-6 h-6 object-contain">` : '';

                    const cardClass = match.isFinished 
                        ? 'bg-dark-800/40 border-gray-800/40 opacity-50 match-card' 
                        : 'bg-dark-800/80 hover:bg-dark-800 border border-gray-800/80 match-card';

                    const centerBlockClass = match.isLive 
                        ? 'border-red-500/80 bg-red-950/20 shadow-lg shadow-red-500/10' 
                        : 'border-gray-800/50 bg-dark-900/60';

                    const timeOrStatusContent = match.isLive
                        ? `<span class="flex items-center justify-center gap-1.5 text-xs font-black text-red-500 uppercase tracking-wider animate-pulse"><span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>LIVE</span>`
                        : (match.isFinished 
                            ? `<span class="text-xs font-extrabold text-gray-400 uppercase tracking-wider text-center">TERMINÉ</span>` 
                            : `<span class="text-base font-extrabold text-white tracking-tight text-center">${match.time}</span>`);

                    // Colonne de score ou classement F1 (alignée à gauche)
                    const scoreColumnHtml = (match.isLive || match.isFinished) && match.score 
                        ? `<div class="flex items-center justify-start px-4 py-1.5 rounded-lg bg-dark-900/80 border border-gray-800 text-xs font-bold text-white tracking-wider shrink-0 shadow-inner text-left leading-tight">${match.score}</div>` 
                        : '';

                    html += `
                        <div class="${cardClass} rounded-xl p-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 transition-all shadow-sm" data-id="${match.id}" data-live="${match.isLive}" data-finished="${match.isFinished}">
                            
                            <!-- Gauche -->
                            <div class="flex items-center space-x-4 flex-grow">
                                <div class="w-10 h-10 rounded-lg bg-dark-900/90 border border-gray-800 flex items-center justify-center shrink-0 overflow-hidden p-1.5">
                                    ${match.isImgIcon ? `<img src="${match.sportIcon}" alt="" class="w-full h-full object-contain">` : `<i class="fa-solid ${match.sportIcon} text-lg text-blue-400"></i>`}
                                </div>

                                <div class="flex flex-col items-center justify-center shrink-0 ${centerBlockClass} px-3 py-1.5 rounded-lg border w-32">
                                    ${match.nature ? `<span class="text-[10px] font-bold text-blue-400 uppercase tracking-wider mb-0.5 text-center">${match.nature}</span>` : ''}
                                    ${timeOrStatusContent}
                                </div>

                                <div class="space-y-1.5 flex-grow pl-2">
                                    <div class="flex items-center space-x-2.5">
                                        ${logo1Html}
                                        <div class="flex items-center space-x-1.5">
                                            <span class="text-gray-100 font-bold text-sm tracking-tight">${match.team1}</span>
                                            ${match.team1Extra ? `<span class="text-gray-300 font-normal text-sm">${match.team1Extra}</span>` : ''}
                                        </div>
                                        ${match.showHomeTeam1 ? '<span class="text-[10px] bg-gray-900 text-gray-400 px-1.5 py-0.5 rounded border border-gray-800">Dom</span>' : ''}
                                    </div>

                                    <div class="flex items-center space-x-2.5">
                                        ${logo2Html}
                                        <span class="${match.category === 'f1' ? 'text-gray-300 text-xs italic font-normal' : 'text-gray-100 font-bold text-sm tracking-tight'}">${match.team2}</span>
                                        ${match.showHomeTeam2 ? '<span class="text-[10px] bg-gray-900 text-gray-400 px-1.5 py-0.5 rounded border border-gray-800">Dom</span>' : ''}
                                    </div>

                                    ${match.venue ? `<div class="text-xs text-gray-400 italic pl-8.5">${match.venue}</div>` : ''}
                                </div>
                            </div>

                            <!-- Droite -->
                            <div class="flex items-center gap-3 flex-wrap justify-end w-full md:w-auto pt-2 md:pt-0 border-t md:border-t-0 border-gray-800/50">
                                ${scoreColumnHtml}
                                <div class="flex items-center gap-1.5 flex-wrap justify-end">
                                    ${channelsHtml}
                                </div>
                            </div>

                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function scrollToNow() {
            // 1. Chercher un match en direct en priorité
            let targetCard = document.querySelector('[data-live="true"]');
            
            // 2. Si aucun live, chercher le premier match non terminé (à venir) parmi les cartes affichées
            if (!targetCard) {
                const cards = document.querySelectorAll('.match-card');
                for (let card of cards) {
                    if (card.getAttribute('data-finished') !== 'true') {
                        targetCard = card;
                        break;
                    }
                }
            }

            // 3. Si vraiment aucun match à venir n'est visible, prendre la première carte
            if (!targetCard) {
                targetCard = document.querySelector('.match-card');
            }

            if (targetCard) {
                targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                targetCard.classList.add('ring-2', 'ring-blue-500', 'transition-all');
                setTimeout(() => {
                    targetCard.classList.remove('ring-2', 'ring-blue-500');
                }, 2000);
            }
        }

        loadData();
    </script>
</body>
</html>
